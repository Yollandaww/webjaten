# Contoh konfigurasi nginx untuk FlyEnv (situs statis, tanpa PHP)
# Ganti path root sesuai lokasi folder desa-sroyo di komputer kamu.
# Opsional: kalau situs dibuat lewat tombol Add di FlyEnv, file ini tidak wajib.

server {
    listen 80;
    server_name desa-sroyo.test;

    root "C:/path/ke/desa-sroyo";
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Request POST (Livewire) ke file statis ditolak nginx dengan 405.
    # Baris ini membuatnya tetap dilayani seperti GET.
    error_page 405 =200 $uri;

    # Arsip bawaan HTTrack, jangan ikut terbuka di browser
    location ^~ /_arsip-httrack/ {
        deny all;
        return 404;
    }

    error_page 404 /not-found.html;
}
